<div class="container">
    <div class="add-flight-container">
    <h2 class="text-center">Add Flight</h2>
    <form (ngSubmit)="addFlight()">
    <div class="form-group">
    <label for="flight-number">Flight Number</label>
    <input type="text" id="flight-number" [(ngModel)]="flight.flightNumber" name="flightNumber" placeholder="Enter flight number" required>
    </div>
    <div class="form-group">
    <label for="airline">Airline</label>
    <input type="text" id="airline" [(ngModel)]="flight.airline" name="airline" placeholder="Enter airline" required>
    </div>
    <div class="form-group">
    <label for="source">Source</label>
    <input type="text" id="source" [(ngModel)]="flight.source" name="source" placeholder="Enter source" required>
    </div>
    <div class="form-group">
    <label for="destination">Destination</label>
    <input type="text" id="destination" [(ngModel)]="flight.destination" name="destination" placeholder="Enter destination" required>
    </div>
    <div class="form-group">
    <label for="departure-time">Departure Time</label>
    <input type=" " id="departure-time" [(ngModel)]="flight.departureTime" name="departureTime" required>
    </div>
    <div class="form-group">
    <label for="arrival-time">Arrival Time</label>
    <input type=" " id="arrival-time" [(ngModel)]="flight.arrivalTime" name="arrivalTime" required>
    </div>
    <div class="form-group">
    <label for="fare">Fare</label>
    <input type="number" id="fare" [(ngModel)]="flight.fare" name="fare" placeholder="Enter fare in USD" required>
    </div>
    <div class="form-group">
    <label for="total-seats">Total Seats</label>
    <input type="number" id="total-seats" [(ngModel)]="flight.totalSeats" name="totalSeats" placeholder="Enter total seats" required>
    </div>
    <div class="form-group">
    <label for="available-seats">Available Seats</label>
    <input type="number" id="available-seats" [(ngModel)]="flight.availableSeats" name="availableSeats" placeholder="Enter available seats" required>
    </div>
    <button type="submit" class="add-button">Add Flight</button>
    <br> &nbsp;
    <button type="submit" class="add-button" (click)="delete()">Delete Flight</button>

    </form>
    <p>{{ message }}</p>
    </div>
    </div>
