<div class="popup-container">
    <h1>Update Wallet</h1>
    <div class="wallet-options">
      <label for="walletInput">Add to Wallet</label>
      <input type="text" id="walletInput" [(ngModel)]="amount" placeholder="Enter amount" />
      <button (click)="addToWallet()">Submit</button>
    </div>
  </div>
